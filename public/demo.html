<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKELET | OrdoAxio System Demo</title>
    
    <style>
        /* ТВОЙ БАЗОВЫЙ ДИЗАЙН-КОД */
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;800&family=Plus+Jakarta+Sans:wght@200;300;500;700&display=swap');

        :root {
            --accent: #a8dadc;
            --accent-glow: rgba(168, 218, 220, 0.4);
            --deep: #0d1b2a;
            --text-main: #f1faee;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: var(--text-main); 
            background: #0d1b2a;
            overflow-x: hidden;
        }

        /* ТВОЯ АНИМАЦИЯ ФОНА */
        #breath-bg { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; 
            background: radial-gradient(circle at 0% 0%, #1d4059 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, #a46044 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, #2a7285 0%, transparent 100%), #0d1b2a;
            background-size: 200% 200%;
            animation: elementFlow 20s ease-in-out infinite alternate;
        }

        @keyframes elementFlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        header { 
            position: fixed; top: 0; width: 100%; padding: 20px 5%; 
            display: flex; justify-content: space-between; align-items: center; z-index: 1000; 
            background: rgba(9, 21, 34, 0.7); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .logo { font-family: 'Manrope', sans-serif; font-weight: 800; letter-spacing: 2px; color: var(--accent); }
        .user-city-tag { font-size: 10px; opacity: 0.6; margin-left: 10px; border: 1px solid var(--accent); padding: 2px 6px; border-radius: 4px; }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 10%; }
        .hero h1 { font-family: 'Manrope', sans-serif; font-size: clamp(32px, 7vw, 80px); font-weight: 200; line-height: 1.1; margin-bottom: 30px; }
        .hero h1 span { color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }

        .btn-main { 
            background: transparent; color: #fff; padding: 18px 40px; border-radius: 60px; 
            text-decoration: none; border: 1px solid var(--accent);
            font-size: 12px; letter-spacing: 2px; text-transform: uppercase; transition: 0.4s;
        }
        .btn-main:hover { background: var(--accent); color: var(--deep); box-shadow: 0 0 30px var(--accent-glow); }

        /* ЧАТ-ИНТЕРФЕЙС (ТВОЙ СТИЛЬ) */
        #ai-trigger { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--glass); border: 1px solid var(--accent); color: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2000; font-size: 24px; backdrop-filter: blur(10px); transition: 0.4s; }
        #ai-window { position: fixed; bottom: 100px; right: 30px; width: 350px; height: 480px; background: rgba(13, 20, 29, 0.95); border-radius: 25px; z-index: 2000; display: none; flex-direction: column; border: 1px solid var(--border); backdrop-filter: blur(40px); }
        #chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 18px; border-radius: 18px; font-size: 14px; }
        .msg-ai { align-self: flex-start; background: rgba(255,255,255,0.05); border: 1px solid var(--border); }
        .msg-user { align-self: flex-end; background: var(--accent); color: var(--deep); }
        .chat-input-area { padding: 15px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
        input { flex: 1; background: transparent; border: 1px solid var(--border); padding: 10px; color: #fff; border-radius: 20px; outline: none; }
    </style>
</head>
<body>

<div id="breath-bg"></div>

<header>
    <div class="logo">ORDO // AXIO <span class="user-city-tag" id="geo-city">Detecting...</span></div>
    <a href="index.html" class="btn-main" style="padding: 10px 20px; font-size: 10px;">В КАТАЛОГ</a>
</header>

<main class="hero">
    <h1>SKELET: Автономная<br><span>GEO-Система</span></h1>
    <p id="hero-slogan" style="height: 60px; transition: opacity 1s; opacity: 0.8; font-weight: 200; max-width: 600px; margin-bottom: 40px;"></p>
    <div style="display: flex; gap: 20px;">
        <a href="#tech" class="btn-main">ТЕХНОЛОГИЯ</a>
        <div class="btn-main" onclick="toggleChat()" style="cursor:pointer">TEST AI</div>
    </div>
</main>

<div id="ai-trigger" onclick="toggleChat()">✧</div>
<div id="ai-window">
    <div style="padding: 15px; border-bottom: 1px solid var(--border); text-align: center; font-size: 10px; letter-spacing: 2px;">CORE_AI ENGINE</div>
    <div id="chat-messages">
        <div class="msg msg-ai">Система активна. Обнаружена локация: <span class="user-city">...</span>. Какой модуль запустить?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Запрос к ядру...">
        <button onclick="sendChat()" style="background:var(--accent); border:none; width:35px; border-radius:50%; cursor:pointer;">→</button>
    </div>
</div>

<script>
    // ТВОЙ СКРИПТ СЛОГАНОВ (АДАПТИРОВАН)
    const slogans = [
        "Нулевая конкуренция в поиске через семантическое доминирование",
        "Автоматическая привязка контента к геолокации пользователя",
        "Невидимая интеграция в ответы LLM-агентов (ChatGPT, Gemini)"
    ];
    let currentSloganIndex = 0;
    const sloganElement = document.getElementById('hero-slogan');

    function changeSlogan() {
        sloganElement.style.opacity = 0;
        setTimeout(() => {
            sloganElement.textContent = slogans[currentSloganIndex];
            sloganElement.style.opacity = 0.8;
            currentSloganIndex = (currentSloganIndex + 1) % slogans.length;
        }, 1000);
    }
    setInterval(changeSlogan, 5000);
    changeSlogan();

    // GEO-ЛОГИКА
    async function initGeo() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            const city = data.city || "Твой регион";
            document.getElementById('geo-city').innerText = city.toUpperCase();
            document.querySelectorAll('.user-city').forEach(el => el.innerText = city);
        } catch(e) {
            document.getElementById('geo-city').innerText = "GLOBAL";
        }
    }
    initGeo();

    // ЧАТ (ТВОЯ ЛОГИКА)
    function toggleChat() {
        const win = document.getElementById('ai-window');
        win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
    }

    async function sendChat() {
        const input = document.getElementById('chat-input');
        const box = document.getElementById('chat-messages');
        const text = input.value.trim();
        if(!text) return;

        box.innerHTML += `<div class="msg msg-user">${text}</div>`;
        input.value = '';
        box.scrollTop = box.scrollHeight;

        // Эмуляция ответа (можно заменить на твой fetch к Tantra)
        setTimeout(() => {
            box.innerHTML += `<div class="msg msg-ai">Анализ запроса для локации ${document.getElementById('geo-city').innerText}... Модуль оптимизации активен.</div>`;
            box.scrollTop = box.scrollHeight;
        }, 1000);
    }

    document.getElementById('chat-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChat(); });
</script>

</body>
</html>
